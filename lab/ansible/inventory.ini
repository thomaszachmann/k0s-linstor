# Alle Nodes mit DRBD. storage_ip leer = kein Storage-Netz (Witness).
[linstor_satellites]
k0s-ctrl ansible_host=172.16.0.176 mgmt_ip=172.16.0.176 storage_ip=
k0s-w1   ansible_host=172.16.0.186 mgmt_ip=172.16.0.186 storage_ip=10.10.0.11 zone=a
k0s-w2   ansible_host=172.16.0.36  mgmt_ip=172.16.0.36  storage_ip=10.10.0.12 zone=b
k0s-w3   ansible_host=172.16.0.72  mgmt_ip=172.16.0.72  storage_ip=10.10.0.13 zone=a

# Nodes, die den Controller übernehmen können
[linstor_controllers]
k0s-w1
k0s-w2
k0s-w3

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab
