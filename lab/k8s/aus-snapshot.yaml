apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pg-kopie, namespace: demo}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: pg-vor-update
---
apiVersion: v1
kind: Pod
metadata: {name: pg-kopie-lesen, namespace: demo}
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: [sleep, "3600"]
      volumeMounts: [{name: d, mountPath: /pgdata}]
  volumes:
    - {name: d, persistentVolumeClaim: {claimName: pg-kopie}}
