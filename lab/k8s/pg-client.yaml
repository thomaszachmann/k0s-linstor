apiVersion: v1
kind: Service
metadata: {name: pg, namespace: demo}
spec:
  selector: {app: pg}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pg-client, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: pg-client}}
  template:
    metadata: {labels: {app: pg-client}}
    spec:
      containers:
        - name: client
          image: postgres:17.6
          env: [{name: PGPASSWORD, value: lab-only}]
          command: [bash, -c]
          args:
            - |
              psql -h pg -U postgres -c "create table if not exists puls(zeit timestamptz default now())"
              while true; do
                if timeout 3 psql -h pg -U postgres -qc "insert into puls default values" 2>/dev/null; then
                  echo "$(date +%T) ok"
                else
                  echo "$(date +%T) FEHLER"
                fi
                sleep 1
              done
