apiVersion: v1
kind: Namespace
metadata: {name: kapazitaet}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: klein, namespace: kapazitaet}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: fueller, namespace: kapazitaet}
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: [sleep, "86400"]
      volumeMounts: [{name: daten, mountPath: /daten}]
  volumes:
    - name: daten
      persistentVolumeClaim: {claimName: klein}
