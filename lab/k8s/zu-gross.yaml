apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: zu-gross, namespace: kapazitaet}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 40Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: zu-gross, namespace: kapazitaet}
spec:
  containers:
    - {name: shell, image: busybox:1.36, command: [sleep, "86400"], volumeMounts: [{name: d, mountPath: /d}]}
  volumes:
    - {name: d, persistentVolumeClaim: {claimName: zu-gross}}
