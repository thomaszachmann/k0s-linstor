# Loki als ein einziger Pod mit Dateisystem-Speicher. Reicht für ein Lab
# und kleine Cluster. Für mehr Last: Objektspeicher und SimpleScalable.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 768Mi}
  persistence:
    enabled: true
    size: 5Gi
    storageClass: linstor-replicated

# Alles abschalten, was ein Single-Binary-Lab nicht braucht.
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
