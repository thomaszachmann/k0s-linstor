# Alloy als DaemonSet: liest auf jedem Worker das Journal (LINSTOR-Satellite,
# drbd-reactor, Kernelmeldungen von DRBD) und die Logs aller Pods.
alloy:
  mounts:
    varlog: true          # /var/log/journal
    extra:
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
  # Node-Name, damit jeder Alloy-Pod nur die Pods seines Nodes liest.
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef: {fieldPath: spec.nodeName}
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  configMap:
    content: |
      // --- Journal der Hosts --------------------------------------------
      loki.relabel "journal" {
        forward_to = []
        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal__hostname"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__journal__transport"]
          target_label  = "transport"
        }
        rule {
          source_labels = ["__journal_priority_keyword"]
          target_label  = "level"
        }
      }

      loki.source.journal "host" {
        max_age       = "12h"
        relabel_rules = loki.relabel.journal.rules
        labels        = {job = "journal"}
        forward_to    = [loki.write.lab.receiver]
      }

      // --- Pod-Logs über die Kubernetes-API ------------------------------
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.lab.receiver]
      }

      loki.write "lab" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  # Das Journal ist nur mit der machine-id des Hosts lesbar.
  volumes:
    extra:
      - name: machine-id
        hostPath: {path: /etc/machine-id}
